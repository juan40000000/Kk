plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.juan.monocromo'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.juan.monocromo'
        minSdk = 26
        targetSdk = 34
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
        versionName = '1.0'
        // Solo 64 bits (casi todos los Android actuales): el motor de Firefox ocupa mucho.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Clave fija para que cada nueva APK se instale encima de la anterior.
    signingConfigs {
        release {
            storeFile = file('monocromo.jks')
            storePassword = 'monocromo'
            keyAlias = 'monocromo'
            keyPassword = 'monocromo'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.release
        }
    }

    // Comprimir las librerías nativas (el motor de Firefox): la APK pesa mucho menos al descargarla.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Motor de Firefox para el navegador Calamuchita.
    implementation 'org.mozilla.geckoview:geckoview:+'
}
