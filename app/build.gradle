plugins {
    id 'com.android.application'
}

android {
    namespace 'com.juan.notasvoz'
    compileSdk 35

    defaultConfig {
        applicationId 'com.juan.notasvoz'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Llave fija para que las nuevas versiones se instalen encima de las anteriores.
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
