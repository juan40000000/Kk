name: Construir APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk NotasVoz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotasVoz-apk
          path: NotasVoz.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Notas de voz (versión ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: NotasVoz.apk
          body: |
            Descarga **NotasVoz.apk** desde el teléfono y ábrela para instalar.
            Enlace directo siempre actualizado:
            https://github.com/${{ github.repository }}/releases/latest/download/NotasVoz.apk
