name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon | grep -m1 "geckoview" || true
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Monocromo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Monocromo-apk
          path: Monocromo.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monocromo-${{ github.run_number }}
          name: Monocromo ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: Monocromo.apk
          body: Descarga **Monocromo.apk** desde tu Android e instálala.
