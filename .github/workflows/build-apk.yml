name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WifiRadar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WifiRadar-apk
          path: WifiRadar.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WiFi Radar (última versión)
          body: |
            APK generado automáticamente desde `${{ github.sha }}`.
            Descarga **WifiRadar.apk** desde el móvil e instálalo (permite "instalar apps de origen desconocido").
          prerelease: true
          files: WifiRadar.apk
