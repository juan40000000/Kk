<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070B14">
  <title>Pulso Global</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 108 108" aria-hidden="true">
          <circle cx="54" cy="54" r="30" fill="none" stroke="#9F8CFF" stroke-width="3"/>
          <path d="M54,24C42,32 42,76 54,84C66,76 66,32 54,24z" fill="none" stroke="#5B47D6" stroke-width="2"/>
          <path d="M20,56H40L46,44L54,70L61,50L66,56H88" fill="none" stroke="#3BE8B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="38" r="5" fill="#FF4D6D"/>
        </svg>
        <div>
          <div class="title">Pulso Global</div>
          <div class="subtitle"><span class="live-dot"></span><span id="status">Conectando…</span></div>
        </div>
      </div>
      <div class="risk" id="riskBadge" title="Índice de tensión global">
        <div class="risk-label">Tensión</div>
        <div class="risk-val" id="riskVal">—</div>
      </div>
    </header>

    <div class="tape" id="tape"><div class="tape-track" id="tapeTrack"></div></div>

    <main>
      <!-- GLOBO -->
      <section class="view active" id="view-globe">
        <canvas id="globe"></canvas>
        <div class="globe-ui">
          <div class="seg" id="projSeg">
            <button class="on" data-proj="globe">Globo 3D</button>
            <button data-proj="flat">Mapa</button>
          </div>
          <div class="seg" id="layerSeg">
            <button class="on" data-layer="links">Conexiones</button>
            <button class="on" data-layer="markets">Bolsas</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="dot red"></i>Conflicto</span>
          <span><i class="dot up"></i>Sube</span>
          <span><i class="dot down"></i>Baja</span>
          <span><i class="line"></i>Impacto</span>
        </div>
        <div class="hot-strip" id="hotStrip"></div>
      </section>

      <!-- GRAFO -->
      <section class="view" id="view-graph">
        <canvas id="graph"></canvas>
        <div class="graph-ui">
          <div class="chips" id="graphFilters">
            <button class="chip on" data-g="conflict">Conflictos</button>
            <button class="chip on" data-g="country">Países</button>
            <button class="chip on" data-g="asset">Activos</button>
            <button class="chip on" data-g="news">Noticias</button>
          </div>
        </div>
        <div class="graph-legend"><span><i class="dot red"></i>Conflicto</span><span><i class="dia"></i>Activo</span><span><i class="dot" style="background:#9AA3BF"></i>País</span><span><i class="dot" style="background:#A28BFF"></i>Noticia</span></div>
        <div class="graph-hint" id="graphHint">Tocá un nodo para ver sus conexiones · pellizcá para zoom</div>
      </section>

      <!-- NOTICIAS -->
      <section class="view scroll" id="view-news">
        <div class="chips sticky" id="newsFilters"></div>
        <div id="newsList" class="list"></div>
      </section>

      <!-- MERCADOS -->
      <section class="view scroll" id="view-markets">
        <div class="pulse-card" id="pulseCard"></div>
        <div id="marketList"></div>
        <p class="fine">Cotizaciones con demora según la plaza. Fuente: Yahoo Finance. No es asesoramiento financiero.</p>
      </section>
    </main>

    <nav class="tabs">
      <button class="tab on" data-view="globe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span>Mundo</span></button>
      <button class="tab" data-view="graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="17" r="3"/><circle cx="20" cy="17" r="1.6"/><path d="M8 8.5l2.6 6M16.4 7.4L13.4 14.6M15 17h3.4M8.4 7l7.6-.8"/></svg><span>Red</span></button>
      <button class="tab" data-view="news"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h10M7 13h10M7 17h6"/></svg><span>Noticias</span><b class="badge" id="newsBadge"></b></button>
      <button class="tab" data-view="markets"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg><span>Mercados</span></button>
    </nav>

    <div class="sheet-backdrop" id="backdrop"></div>
    <div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-body" id="sheetBody"></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/world-110m.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
